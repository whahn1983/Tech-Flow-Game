services:
  tech-flow-game:
    build: .
    image: tech-flow-game:latest
    container_name: tech-flow-game
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      # Comma-separated origins permitted to call the leaderboard API.
      # Leave unset for same-origin only.
      ALLOWED_ORIGINS: ""
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      # Persists leaderboard.txt, dailyseed.txt, and nonces.txt across container restarts.
      # The container's root filesystem is read-only, so all writable state
      # must live under /app/data.
      #
      # The image runs as a fixed UID/GID (1001:1001). If you migrate from an
      # older image that used auto-assigned IDs and see EACCES on writes, fix
      # the volume's ownership once with:
      #   docker compose run --rm --user root tech-flow-game \
      #     chown -R 1001:1001 /app/data
      - leaderboard-data:/app/data

volumes:
  leaderboard-data:
