name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
          extensions: pdo_sqlite, mbstring

      - name: Install dependencies
        run: npm ci
        working-directory: web-app

      - name: Node syntax check
        run: npm run syntax
        working-directory: web-app

      - name: PHP syntax check
        run: php -l leaderboard.php
        working-directory: web-app

      - name: Validate manifest.json
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'));"
        working-directory: web-app

      - name: ESLint
        run: npm run lint
        working-directory: web-app

      - name: Prettier (check)
        run: npm run format
        working-directory: web-app

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: web-app

      - name: Run tests
        run: npm test
        working-directory: web-app
